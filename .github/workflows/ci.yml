name: CI

# Build-and-boot smoke (Phase 8, E4). The test suite and the data live outside
# the repository by design, so this proves only that the deliverable compiles,
# builds and boots on a clean machine.
on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Compile-check all sources
        run: python -m compileall -q src

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build the image
        run: docker compose build

      - name: Boot the stack
        run: docker compose up -d

      - name: Wait for the API health endpoint
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo; echo "API healthy"; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy"
          docker compose ps
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
