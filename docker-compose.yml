services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # C collation keeps ORDER BY on text identical to SQLite's bytewise order
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      TARIFF_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - uploads:/app/data/uploads
      - logs:/app/data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- Airflow (B19), profile "airflow"
  # Nothing below starts or builds unless the profile is named: `docker compose --profile airflow up -d`.
  # Metadata lives in its own `airflow` database on the same Postgres server, never in the tariff
  # database. DAG tasks reach the tariff data through TARIFF_DB_URL, which names AIRFLOW_TARIFF_DB
  # (default: the B19 scratch clone), not the primary.
  airflow-db-create:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["bash", "-c"]
    command:
      - >-
        psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -tAc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1
        || createdb -h postgres -U "${POSTGRES_USER}" --locale=C --encoding=UTF8 --template=template0 airflow
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: &airflow-common
      build:
        context: .
        dockerfile: Dockerfile.airflow
      image: tariff-audit-engine-airflow:2.11.2
      profiles: ["airflow"]
      environment: &airflow-env
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
        AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
        AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
        TARIFF_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_TARIFF_DB:-tariff_b19_scratch}
        TARIFF_PRIMARY_DB_NAME: ${POSTGRES_DB}
        TARIFF_UPLOAD_DIR: /tmp/tariff-uploads
      volumes:
        - ./dags:/opt/airflow/dags:ro
        - ./src:/opt/tariff/src:ro
        - ./docs:/opt/tariff/docs:ro
        - ./data/raw:/opt/tariff/data/raw:ro
        - ./data/cache:/opt/tariff/data/cache:ro
        - airflow-logs:/opt/airflow/logs
      depends_on:
        postgres:
          condition: service_healthy
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: ["version"]
    depends_on:
      airflow-db-create:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: ["webserver"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 30
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 15s
      timeout: 15s
      retries: 20
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
  logs:
  airflow-logs:
